name: Android 自动检查

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建、单元测试与 Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: 显式安装 Android SDK 工具
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: 安装固定的 Android 构建平台
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 编译并检查（不接触正式签名）
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: 保存测试和 Lint 报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: ignore
      - name: 汇总通过、失败和跳过数量
        if: always()
        shell: pwsh
        run: |
          $taskFiles = Get-ChildItem app/build/test-results -Filter 'TEST-*.xml' -Recurse -ErrorAction SilentlyContinue
          $taskTests = 0; $taskFailures = 0; $taskErrors = 0; $taskSkipped = 0
          foreach ($taskFile in $taskFiles) {
            foreach ($taskSuite in (Select-Xml -LiteralPath $taskFile.FullName -XPath '/testsuite | /testsuites/testsuite').Node) {
              $taskTests += [int]$taskSuite.tests; $taskFailures += [int]$taskSuite.failures
              $taskErrors += [int]$taskSuite.errors; $taskSkipped += [int]$taskSuite.skipped
            }
          }
          "单元测试：总数 $taskTests，通过 $($taskTests-$taskFailures-$taskErrors-$taskSkipped)，失败 $taskFailures，错误 $taskErrors，跳过 $taskSkipped。" >> $env:GITHUB_STEP_SUMMARY

  instrumented:
    name: 模拟器 API ${{ matrix.api }} 实测
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: 显式安装 Android SDK 工具
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: 安装固定的编译平台
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
      - name: 启用模拟器硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 实际执行数据库和界面测试
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash .github/scripts/device-tests.sh
      - name: 保存真实执行结果（含跳过项目）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/visual116/
            app/build/outputs/connected_android_test_additional_output/**/visual116/*.png
            app/build/outputs/connected_android_test_additional_output/**/visual117/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: 汇总设备实测结果
        if: always()
        shell: pwsh
        run: |
          $taskFiles = Get-ChildItem app/build/outputs/androidTest-results -Filter '*.xml' -Recurse -ErrorAction SilentlyContinue
          $taskTests = 0; $taskFailures = 0; $taskErrors = 0; $taskSkipped = 0
          foreach ($taskFile in $taskFiles) {
            foreach ($taskSuite in (Select-Xml -LiteralPath $taskFile.FullName -XPath '/testsuite | /testsuites/testsuite').Node) {
              $taskTests += [int]$taskSuite.tests; $taskFailures += [int]$taskSuite.failures
              $taskErrors += [int]$taskSuite.errors; $taskSkipped += [int]$taskSuite.skipped
            }
          }
          "API${{ matrix.api }} 实测：总数 $taskTests，通过 $($taskTests-$taskFailures-$taskErrors-$taskSkipped)，失败 $taskFailures，错误 $taskErrors，跳过 $taskSkipped。" >> $env:GITHUB_STEP_SUMMARY
          if ($taskTests -eq 0 -or $taskTests -eq $taskSkipped) { throw '未实际执行任何设备测试，不能视为通过' }

  performance:
    name: 同机一万笔账目性能对比
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v1.1.16
          path: baseline117
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
      - name: 安装平台并启用KVM
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/performance117.sh
      - name: 保存同机帧耗时与真实执行报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-comparison-117
          retention-days: 7
          if-no-files-found: ignore
          path: |
            baseline117/app/build/outputs/connected_android_test_additional_output/**/performance117/*.json
            app/build/outputs/connected_android_test_additional_output/**/performance117/*.json
            baseline117/app/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
